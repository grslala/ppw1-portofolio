<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tugas 1 CSS Position</title>
  <style>
    
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgb(81, 55, 36);
      color: white;
      padding: 10px;
    }

    .profile-card {
      position: relative;
      width: 280px;
      height: 350px;
      border: 1px solid black;
      margin: 40px auto;
      text-align: center;
      padding-top: 60px;
    }

    .status-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      border: 1px solid black;
      color: rgb(0, 0, 0);
      padding: 4px 8px;
      font-size: 12px;
    }

    .back-to-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 200;
    }
  </style>
</head>
<body>

  <nav class="navbar">Navbar</nav>

  <br><br><br><br><br>

  <div class="profile-card">
    <div class="status-badge">🟢 Online</div>
    <img src="capybara.jpeg" alt="foto profil" width="100"><br><br>
    <strong>Capy Bara</strong><br>
    <span>Hewan berkaki 4</span><br><br>
  </div>

  <br><br><br><br><br><br><br><br><br><br><br><br>

  <button class="back-to-top" onclick="window.scrollTo(0,0)">Back to Top</button>

</body>
</html>
