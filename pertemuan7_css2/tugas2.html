<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas 2 Flexbox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgb(252, 168, 71);
      color: white;
      padding: 12px 20px;
    }
    .navbar ul {
      display: flex;
      gap: 16px;
      list-style: none;
    }
    .navbar ul a { color: white; text-decoration: none; }

    .hero {
      display: flex;
      align-items: center;
      gap: 30px;
      padding: 40px 100px;
      background: #ffffff;
    }
    .hero-text { flex: 1; }
    .hero-text h1 { margin-bottom: 10px; }
    .hero-image { flex: 1; text-align: center; }
    .hero-image img { width: 100%; max-width: 300px; }

    
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 40px 20px;
      justify-content: center;
    }
    .card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      width: 200px;
      text-align: center;
    }
    .card h3 { margin-bottom: 8px; }

    .footer {
      display: flex;
      gap: 20px;
      background: #222;
      color: white;
      padding: 30px 20px;
    }
    .footer div { flex: 1; }
    .footer h4 { margin-bottom: 8px; }
    .footer p { font-size: 13px; color: #aaa; }

    
    @media (max-width: 600px) {
      .hero { flex-direction: column; }
      .footer { flex-direction: column; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <strong>MyBrand</strong>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Produk</a></li>
      <li><a href="#">Kontak</a></li>
    </ul>
  </nav>

  <section class="hero">
    <div class="hero-text">
      <h1>Halooo!</h1>
    </div>
    <div class="hero-image">
      <img src="hmstr.jpg" alt="ilustrasi">
    </div>
  </section>

  <section class="cards">
    <div class="card">
      <h3>Produk A</h3>
      <p>Deskripsi A</p>
    </div>
    <div class="card">
      <h3>Produk B</h3>
      <p>Deskripsi B</p>
    </div>
    <div class="card">
      <h3>Produk C</h3>
      <p>Deskripsi C</p>
    </div>
  </section>

  <footer class="footer">
    <div>
      <h4>Tentang Kami</h4>
      <p>cit cit cit cit citcitcit.</p>
    </div>
    <div>
      <h4>Link</h4>
      <p>Home · Produk · Kontak</p>
    </div>
    <div>
      <h4>Kontak</h4>
      <p>email@mybrand.com</p>
    </div>
  </footer>

</body>
</html>
