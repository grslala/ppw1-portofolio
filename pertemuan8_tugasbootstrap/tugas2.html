<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tugas 2 - Formulir Pendaftaran</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-4">
  <h4 class="mb-3">Formulir Pendaftaran Mahasiswa Baru</h4>

  <div class="alert alert-success alert-dismissible fade show d-none" id="alertSukses" role="alert">
    <strong>Berhasil!</strong> Data mahasiswa telah disimpan.
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="card">
    <div class="card-body">
      <form id="formDaftar">

        <div class="row g-3">
          <div class="col-md-6">
            <label for="nama" class="form-label">Nama Lengkap</label>
            <input type="text" class="form-control" id="nama" placeholder="Masukkan nama lengkap">
            <div class="valid-feedback">Nama valid.</div>
            <div class="invalid-feedback">Nama lengkap wajib diisi.</div>
          </div>
          <div class="col-md-6">
            <label for="nim" class="form-label">NIM</label>
            <input type="text" class="form-control" id="nim" placeholder="Contoh: 1234567">
            <div class="valid-feedback">NIM valid.</div>
            <div class="invalid-feedback">NIM wajib diisi (angka, min 7 digit).</div>
          </div>
        </div>

        <div class="mb-3 mt-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="emailku@email.com">
        </div>

        <div class="mb-3">
          <label for="prodi" class="form-label">Program Studi</label>
          <select class="form-select" id="prodi">
            <option value="">Pilih program studi...</option>
            <option value="trpl">TRPL</option>
            <option value="tre">TRE</option>
            <option value="tri">TRI</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="semester" class="form-label">Semester</label>
          <select class="form-select" id="semester">
            <option value="">Pilih semester...</option>
            <option value="1">Semester 1</option>
            <option value="2">Semester 2</option>
            <option value="3">Semester 3</option>
            <option value="4">Semester 4</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="alamat" class="form-label">Alamat</label>
          <textarea class="form-control" id="alamat" rows="3" placeholder="Masukkan alamat lengkap"></textarea>
        </div>

        <div class="mb-3">
          <label for="foto" class="form-label">Foto Profil</label>
          <input class="form-control" type="file" id="foto" accept="image/*">
        </div>

        <div class="d-flex gap-2">
          <button type="button" class="btn btn-primary" id="btnSimpan">Simpan</button>
          <button type="reset" class="btn btn-secondary" id="btnReset">Reset</button>
        </div>

      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('btnSimpan').addEventListener('click', function () {
    const nama = document.getElementById('nama');
    const nim  = document.getElementById('nim');
    let valid  = true;

    if (nama.value.trim().length < 3) {
      nama.classList.remove('is-valid');
      nama.classList.add('is-invalid');
      valid = false;
    } else {
      nama.classList.remove('is-invalid');
      nama.classList.add('is-valid');
    }

    if (!/^\d{7,10}$/.test(nim.value.trim())) {
      nim.classList.remove('is-valid');
      nim.classList.add('is-invalid');
      valid = false;
    } else {
      nim.classList.remove('is-invalid');
      nim.classList.add('is-valid');
    }

    if (valid) {
      document.getElementById('alertSukses').classList.remove('d-none');
    }
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    ['nama', 'nim'].forEach(function (id) {
      const el = document.getElementById(id);
      el.classList.remove('is-valid', 'is-invalid');
    });
    document.getElementById('alertSukses').classList.add('d-none');
  });
</script>
</body>
</html>
