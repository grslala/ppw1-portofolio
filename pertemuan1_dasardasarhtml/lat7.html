<html>
    <head>
        <title>jenis-jenis list</title>
    </head>
    <body>
        <h3>Unsorted list:</h4>
        <ul>
            <li>List1</li>
            <li>List2</li>
            <li>List3</li>
        </ul>
        <h3>List Bernomor:</h4>
        <ol>
            <li>List1</li>
            <li>List2</li>
            <li>List3</li>
        </ol>
        <h3>List dengan huruf:</h4>
        <ol type="A">
            <li>List1</li>
            <li>List2</li>
            <li>List3</li>
        </ol>
    </body>
</html>
