<html>
    <head>
        <title>Garis Horizontal dan komentar tersembunyi</title>
    </head>
    <body>
        <p> tag hr untuk membuat garis horizontal, defaultnya adalah rata tengah:</p>
        <hr color="red">
        <p align="left">Terdapat paragraf disini</p>
        <hr color="yellow" width="80%" size="10" align="left">
        <p align="right">Terdapat paragraf disini</p>
        <hr width="400" size="6" align="right" color="blue">
        <center>
            <p>Terdapat paragraf disini</p>
        </center>
        <!- Ini adalah komentar yang tidak akan ditampilkan di layar browser -->
    </body>
</html>
